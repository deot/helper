<!DOCTYPE html>
<!-- GitHub Pages deep-link fallback; @deot/docs-client restores the stored route. -->
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script>
		sessionStorage['@deot/docs:redirect'] = location.pathname + location.search + location.hash;
	</script>
	<meta http-equiv="refresh" content="0;URL='/helper/'" />
</head>
<body></body>
</html>

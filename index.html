<!DOCTYPE html>
<!-- 404.html stores GitHub Pages deep links for @deot/docs-client to restore. -->
<html lang="zh-CN">
<head>
	<title>@deot/helper 文档</title>
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<meta charset="UTF-8">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@deot/docs-client/dist/index.style.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@deot/docs-renderer/dist/index.style.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@deot/docs-markdown/dist/index.style.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@deot/docs-playground/dist/index.style.css">
</head>
<body>
	<div id="app"></div>
	<script>
		const repositoryRaw = 'https://raw.githubusercontent.com/deot/helper/refs/heads/main/';
		const repositoryBlob = 'https://github.com/deot/helper/blob/main/';
		const locales = {
			'zh-CN': { label: '简体中文' },
			'en-US': { label: 'English' }
		};
		const packages = [
			{ label: 'index', value: 'index' },
			{ label: 'cache', value: 'cache' },
			{ label: 'device', value: 'device' },
			{ label: 'dom', value: 'dom' },
			{ label: 'emitter', value: 'emitter' },
			{ label: 'fp', value: 'fp' },
			{ label: 'is', value: 'is' },
			{ label: 'load', value: 'load' },
			{ label: 'resize', value: 'resize' },
			{ label: 'route', value: 'route' },
			{ label: 'scheduler', value: 'scheduler' },
			{ label: 'shared', value: 'shared' },
			{ label: 'unicode', value: 'unicode' },
			{ label: 'utils', value: 'utils' },
			{ label: 'validator', value: 'validator' },
			{ label: 'wheel', value: 'wheel' }
		];
		const packageReadmes = Object.fromEntries(packages.map(item => [
			item.value,
			`packages/${item.value}/README.md`
		]));
		const readmes = { guide: 'README.md', ...packageReadmes };
		const readmeRoutes = Object.fromEntries(Object.entries(readmes).flatMap(([value, source]) => {
			const route = `/packages/${value}`;
			return source.endsWith('/README.md')
				? [[source, route], [source.slice(0, -'/README.md'.length), route]]
				: [[source, route]];
		}));
		const localeReadmes = Object.fromEntries(Object.keys(locales).map(lang => [lang, readmes]));
		const sidebars = Object.fromEntries(Object.keys(locales).map(lang => [
			lang,
			[
				{
					label: lang === 'zh-CN' ? '简介' : 'Introduction',
					value: '/packages/guide'
				},
				{
					label: 'Packages',
					children: packages.map(item => ({
						label: item.label,
						value: `/packages/${item.value}`
					}))
				}
			]
		]));

		const createHomeDocument = (lang) => {
			const t = (zh, en) => (lang === 'zh-CN' ? zh : en);
			const accent = '#2563eb';
			const accentSecondary = '#14b8a6';
			const action = {
				label: t('开始使用', 'Quick Start'),
				to: `/${lang}/packages/guide`,
				variant: 'solid',
				size: 'large',
				color: accent,
				textColor: '#ffffff'
			};
			const appearance = {
				marginTop: 0,
				marginBottom: 80,
				paddingTop: 0,
				paddingBottom: 0,
				maxWidth: 1200
			};
			const block = (id, type, props, customAppearance = appearance) => ({
				id,
				module: { type, version: 1, props },
				appearance: customAppearance
			});

			return {
				schemaVersion: 2,
				meta: { id: `helper-home-${lang}`, title: '@deot/helper' },
				layout: {
					mode: 'sortable',
					maxWidth: 1920,
					minHeight: 600,
					background: '#ffffff'
				},
				blocks: [
					block('home-hero', 'hero', {
						eyebrow: '@deot/helper',
						title: t('面向 JavaScript 开发的实用工具集', 'Practical helpers for JavaScript'),
						description: t(
							'按能力拆分为独立包，提供 TypeScript 类型，并遵守 tree-shaking。',
							'Modular TypeScript utilities designed for tree-shaking and focused imports.'
						),
						align: 'left',
						accent,
						accentSecondary,
						background: '',
						showVisual: true,
						minHeight: 500,
						highlights: [
							{ value: '16', label: t('独立包', 'Packages') },
							{ value: 'TS', label: t('类型支持', 'Typed') },
							{ value: 'ESM', label: 'Tree-shaking' }
						],
						actions: [action]
					}, { ...appearance, marginBottom: 64, fullWidth: true }),
					block('home-features', 'features', {
						eyebrow: t('设计', 'Design'),
						title: t('按需选择，也可一次引入', 'Pick a package or use the collection'),
						description: t(
							'从类型判断、DOM 和缓存，到函数式编程、调度与验证。',
							'From type guards, DOM and cache helpers to FP, scheduling and validation.'
						),
						columns: 3,
						gap: 24,
						items: [
							{
								title: t('模块化', 'Modular'),
								description: t('独立安装所需能力，控制依赖和产物体积。', 'Install only the capability you need.'),
								badge: 'Packages',
								icon: 'grid',
								accent
							},
							{
								title: 'Tree-shaking',
								description: t('使用具名导出，让构建工具移除未使用代码。', 'Named exports let bundlers remove unused code.'),
								badge: 'ESM',
								icon: 'filter',
								accent: accentSecondary
							},
							{
								title: t('跨环境', 'Cross-runtime'),
								description: t('通用工具支持 Node，DOM 类能力明确标注浏览器环境。', 'Universal helpers support Node; browser-only APIs are documented.'),
								badge: 'Browser / Node',
								icon: 'link',
								accent: '#8b5cf6'
							}
						]
					}),
					block('home-steps', 'steps', {
						eyebrow: t('上手', 'Start'),
						title: t('三步使用工具包', 'Use a helper in three steps'),
						columns: 3,
						items: [
							{ title: t('选择', 'Choose'), description: t('选择独立包或聚合包。', 'Choose a focused package or the collection.'), icon: '01', accent },
							{ title: t('安装', 'Install'), description: 'pnpm add @deot/helper-utils', icon: '02', accent: accentSecondary },
							{ title: t('导入', 'Import'), description: t('使用具名导出调用所需 API。', 'Import only the named APIs you use.'), icon: '03', accent: '#8b5cf6' }
						]
					}),
					block('home-cta', 'cta', {
						eyebrow: t('文档', 'Documentation'),
						title: t('浏览全部包与 API', 'Explore every package and API'),
						description: t('从包列表进入安装说明、示例和公共 API。', 'Open any package for installation, examples and public APIs.'),
						align: 'center',
						accent,
						accentSecondary,
						background: '',
						actions: [action]
					}, { ...appearance, marginBottom: 0, fullWidth: true })
				]
			};
		};

		const pathSegments = location.pathname.split('/');
		const localeIndex = pathSegments.findIndex(segment => Boolean(locales[segment]));
		const basePath = localeIndex >= 0
			? `${pathSegments.slice(0, localeIndex).join('/')}/`
			: location.pathname.endsWith('/')
				? location.pathname
				: new URL('./', location.href).pathname;
		const logo = `data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#2563eb"/><text x="32" y="40" fill="#fff" font-family="Georgia,Times New Roman,serif" font-size="25" font-style="italic" font-weight="700" text-anchor="middle">f(x)</text></svg>')}`;
		if (typeof document !== 'undefined') {
			const favicon = document.createElement('link');
			favicon.rel = 'icon';
			favicon.type = 'image/svg+xml';
			favicon.href = logo;
			document.head.appendChild(favicon);
		}

			window.$docs = {
				base: new URL(basePath, location.origin).href,
				namespace: '@deot/helper-site',
				repository: 'https://github.com/deot/helper',
				theme: { default: 'system' },
				layout: {
					header: {
						brand: {
							logo,
							label: '@deot/helper',
							value: '/'
						}
					}
				},
				locales,
				routes: Object.fromEntries([
					['/', {
						content: {
							'zh-CN': createHomeDocument('zh-CN'),
							'en-US': createHomeDocument('en-US')
						}
					}],
					...Object.keys(readmes).map(value => [`/packages/${value}`, {
					value,
					content: 'default',
					sidebar: sidebars,
					header: 'default',
					footer: 'default',
					extra: null
				}]),
				['*', '/packages/guide']
			]),
			resolve: {
				markdown: ({ lang, value }) => (
					localeReadmes[lang] || localeReadmes['zh-CN']
				)[value],
				resource: ({ source, runtime }) => {
					if (source === 'README.md' || /^packages\/[^/]+\/README\.md$/.test(source)) {
						return runtime.mode === 'development'
							? `/${source}`
							: new URL(source, repositoryRaw).href;
					}
					return undefined;
				},
				link: ({ href, lang, source }) => {
					const logicalOrigin = 'https://docs.local';
					let target;
					try {
						target = new URL(href, new URL(source, `${logicalOrigin}/`));
					} catch {
						return undefined;
					}
					if (target.origin !== logicalOrigin) return undefined;
					const path = target.pathname.replace(/^\//, '');
					const route = readmeRoutes[path];
					if (route) return `/${lang}${route}${target.search}${target.hash}`;
					return `${new URL(path, repositoryBlob).href}${target.search}${target.hash}`;
				}
			},
			modules: {
				'@deot/helper-cache': 'https://cdn.jsdelivr.net/npm/@deot/helper-cache@1.1.10/+esm',
				'@deot/helper-device': 'https://cdn.jsdelivr.net/npm/@deot/helper-device@1.1.3/+esm',
				'@deot/helper-dom': 'https://cdn.jsdelivr.net/npm/@deot/helper-dom@1.1.5/+esm',
				'@deot/helper-emitter': 'https://cdn.jsdelivr.net/npm/@deot/helper-emitter@1.1.3/+esm',
				'@deot/helper-fp': 'https://cdn.jsdelivr.net/npm/@deot/helper-fp@1.1.5/+esm',
				'@deot/helper-is': 'https://cdn.jsdelivr.net/npm/@deot/helper-is@1.1.3/+esm',
				'@deot/helper-load': 'https://cdn.jsdelivr.net/npm/@deot/helper-load@1.1.3/+esm',
				'@deot/helper-resize': 'https://cdn.jsdelivr.net/npm/@deot/helper-resize@1.1.3/+esm',
				'@deot/helper-route': 'https://cdn.jsdelivr.net/npm/@deot/helper-route@1.1.9/+esm',
				'@deot/helper-scheduler': 'https://cdn.jsdelivr.net/npm/@deot/helper-scheduler@1.1.8/+esm',
				'@deot/helper-unicode': 'https://cdn.jsdelivr.net/npm/@deot/helper-unicode@1.1.4/+esm',
				'@deot/helper-utils': 'https://cdn.jsdelivr.net/npm/@deot/helper-utils@1.1.8/+esm',
				'@deot/helper-validator': 'https://cdn.jsdelivr.net/npm/@deot/helper-validator@1.1.4/+esm',
				'@deot/helper-wheel': 'https://cdn.jsdelivr.net/npm/@deot/helper-wheel@1.1.6/+esm'
			}
		};
	</script>
	<script type="module" src="https://cdn.jsdelivr.net/npm/@deot/docs-client/+esm"></script>
</body>
</html>
